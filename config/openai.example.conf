# Copy to .local/openai.conf. This example contains no credentials.
# ChatGPT mode uses browser sign-in; press L in the app.
ai_auth_mode=chatgpt
chatgpt_model=
# Optional API mode: set ai_auth_mode=api_key and OPENAI_API_KEY,
# or put the key in .local/openai_api_key (never upload that file).
openai_model=gpt-5.6-luna
openai_api_key_file=openai_api_key
